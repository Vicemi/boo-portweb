[package]
name = "boo-player"
description = "Boo - versión de escritorio (Vicemi Dev)"
version.workspace = true
edition.workspace = true
authors.workspace = true

[[bin]]
name = "boo"
path = "src/main.rs"

[dependencies]
chrono = "0.4.45"
mime_guess = "2.0.5"
muda = "0.21.2"
open = "5.4.4"
percent-encoding = "2.3.2"
png = "0.18.1"
rfd = "0.17.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tao = "0.37.1"
ureq = "3.4.2"
wry = "0.57.0"

[build-dependencies]
embed-resource = "3.0.12"
