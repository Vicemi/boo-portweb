[package]
name = "boo-installer"
description = "Instalador de Boo (Vicemi Dev)"
version.workspace = true
edition.workspace = true
authors.workspace = true

[[bin]]
name = "boo-installer"
path = "src/main.rs"

[dependencies]
dirs = "7.0.0"
mslnk = "0.1.8"
open = "5.4.4"
rfd = "0.17.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tao = "0.37.1"
winreg = "0.56.0"
wry = "0.57.0"
zip = { version = "9.0.2", default-features = false, features = ["deflate"] }

[build-dependencies]
embed-resource = "3.0.12"

[features]
stub = []
